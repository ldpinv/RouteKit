# RouteKit DNS forwarding; merge into dns.forward after private DNS exceptions.
# proxy_rule_set accepts Surge/Clash lists; both clients reuse the same public lists.
dns:
  forward:
    - domain_suffix:
        match: "local"
        value: system
    - domain_suffix:
        match: "lan"
        value: system
    - domain_suffix:
        match: "home.arpa"
        value: system
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/ldpinv/RouteKit/main/Surge/dns/override-overseas.list
        value: Overseas-DoH
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/ldpinv/RouteKit/main/Surge/dns/override-domestic.list
        value: Domestic-DoH
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/ldpinv/RouteKit/main/Surge/custom/ai-cn.list
        value: Domestic-DoH
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/ldpinv/RouteKit/main/Surge/custom/ai.list
        value: Overseas-DoH
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/ldpinv/RouteKit/main/Surge/custom/paypal.list
        value: Overseas-DoH
        update_interval: 86400
    - proxy_rule_set:
