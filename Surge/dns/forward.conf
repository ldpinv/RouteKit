# RouteKit DNS bindings; merge under [Host] after private host mappings.
# Keep this order. Internal/DIRECT selection alone does not imply mainland DNS.
[Host]
local = server:system
*.local = server:system
lan = server:system
*.lan = server:system
home.arpa = server:system
*.home.arpa = server:system
