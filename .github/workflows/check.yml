name: Build and validate rules
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routekit-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 .github/routekit.py build
      - run: python3 -m unittest discover -s .github -v
      - run: python3 .github/routekit.py check
      - name: Publish generated rules on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add List Egern .github/routing-order.json LICENSE
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate client rules'
          git push origin HEAD:main
