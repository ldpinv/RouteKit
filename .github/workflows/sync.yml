name: Sync public upstream rules
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'Allow a reviewed change above the normal count threshold (still creates a PR)'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: routekit-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch, pin and compile public data
        env:
          ALLOW_LARGE: ${{ inputs.allow_large_change }}
        run: |
          if [ "$ALLOW_LARGE" = "true" ]; then
            python3 .github/routekit.py sync --allow-large-change
          else
            python3 .github/routekit.py sync
          fi
      - run: python3 -m unittest discover -s .github -v
      - run: python3 .github/routekit.py check
      - name: Open or update the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse HEAD)
          git add .github/sources.lock.json .github/routing-order.json .github/licenses Surge Egern LICENSE
          if git diff --cached --quiet; then
            echo "No upstream routing changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C automation/upstream
          git commit -m 'Update pinned public routing sources'
          if git ls-remote --exit-code origin refs/heads/automation/upstream >/dev/null; then
            git fetch origin automation/upstream:refs/remotes/origin/automation/upstream
          fi
          git push --force-with-lease origin HEAD:refs/heads/automation/upstream
          head=$(git rev-parse HEAD)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 .github/review.py --base-ref "$base" --head "$head" --run-url "$run_url"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f state=success -f context='RouteKit / generated rules' \
            -f description='生成、路由回归、双端一致性及确定性校验通过' \
            -f target_url="$run_url" --silent
          existing=$(gh pr list --head automation/upstream --base main --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head automation/upstream --title '更新公开分流规则' --body-file .cache/update-pr.md
          else
            gh pr edit "$existing" --body-file .cache/update-pr.md
          fi
          cat .cache/update-pr.md >> "$GITHUB_STEP_SUMMARY"
