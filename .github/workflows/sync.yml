name: Sync public upstream rules
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'Allow a reviewed change above the normal count threshold (still creates a PR)'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: routekit-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch, pin and compile public data
        env:
          ALLOW_LARGE: ${{ inputs.allow_large_change }}
        run: |
          if [ "$ALLOW_LARGE" = "true" ]; then
            python3 .github/routekit.py sync --allow-large-change
          else
            python3 .github/routekit.py sync
          fi
      - run: python3 -m unittest discover -s .github -v
      - run: python3 .github/routekit.py check
      - name: Open or update the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add .github/sources.lock.json .github/routing-order.json List Egern LICENSE
          if git diff --cached --quiet; then
            echo "No upstream routing changes."
            exit 0
          fi
          mkdir -p .cache
          python3 - <<'PY'
          import json
          from pathlib import Path
          stats = json.loads(Path('.cache/reports/summary.json').read_text())
          lines = ['Updates pinned public sources and regenerates both clients.', '',
                   'Validation: routing regressions, format parity, AI coverage and deterministic build checks passed.', '',
                   'Review source versions, category moves and rule counts before merging. Detailed build reports stay in the local cache.', '',
                   '| Ruleset | Entries |', '| --- | ---: |']
          lines += [f'| {key} | {value} |' for key, value in stats['rules'].items() if value]
          Path('.cache/update-pr.md').write_text('\n'.join(lines) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C automation/upstream
          git commit -m 'Update pinned public routing sources'
          if git ls-remote --exit-code origin refs/heads/automation/upstream >/dev/null; then
            git fetch origin automation/upstream:refs/remotes/origin/automation/upstream
          fi
          git push --force-with-lease origin HEAD:refs/heads/automation/upstream
          existing=$(gh pr list --head automation/upstream --base main --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head automation/upstream --title 'Update public routing sources' --body-file .cache/update-pr.md
          else
            gh pr edit "$existing" --body-file .cache/update-pr.md
          fi
